server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 $scheme://$http_host/due-diligence/admin/login;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /due-diligence/api/ {
        proxy_pass http://backend:8000/due-diligence/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
